name: AI outline eval

# Runs scripts/eval-outlines.mjs against the live Workers AI model whenever the
# prompt, the checks or the cases change on main, and on demand (Actions → AI
# outline eval → Run workflow). The result is on the run's summary page. The
# site also runs the same cases on itself every week; see /api/eval.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID   the account the site's Worker runs in
#   CLOUDFLARE_API_TOKEN    a token with only the "Workers AI: Read" permission
# Until both are set, the "eval" job shows as skipped and the summary says
# "Not run", so a green run always means the model was actually asked.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker/outline.js
      - worker/eval.js
      - worker/eval-cases.js
      - outlines.js
      - scripts/eval-outlines.mjs

permissions:
  contents: read

jobs:
  cases:
    name: Check the cases
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the cases (no AI calls)
        run: node scripts/eval-outlines.mjs --dry-run
      - name: Look for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI outline eval not run: add the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets."
            {
              echo "# AI outline eval: not run"
              echo ""
              echo "**Not run: the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets are missing.** The cases were checked without calling the AI. The site's own weekly run of the same cases is at https://wright-ai-solutions.com/api/eval."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  eval:
    name: Run the eval against the live model
    needs: cases
    if: needs.cases.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Ask the model every case
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/eval-outlines.mjs
