name: AI outline eval

# Runs scripts/eval-outlines.mjs against the live Workers AI model, on demand
# only (Actions → AI outline eval → Run workflow). Run it before and after
# changing the prompt, the checks, the guard or the cases. Each case is scored
# as the site runs it (the injection guard first) and by the model alone, and
# both must reach 90%. The result is on the run's summary page, and is added to
# eval-history.csv on the `eval-results` branch (scripts/push-eval-record.sh)
# with its date, commit and model. The site also runs the same cases on itself
# every week and whenever the prompt, guard, model or cases change; see
# /api/eval.
#
# It used to run on every merge that touched the prompt. Each run spends about
# 40 outlines of the same free daily Workers AI allowance visitors use, outside
# the site's own budget, and on 2026-10-02 two runs used it all up, so visitors
# got template outlines for the rest of the day. The site's own eval stays
# inside its budget, so merges now rely on that (docs/COST.md).
#
# "model" asks another Workers AI model with the site's prompt and checks, to
# see whether a cheaper one is good enough. Leave it empty for the site's.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID   the account the site's Worker runs in
#   CLOUDFLARE_API_TOKEN    a token with only the "Workers AI: Read" permission
# Until both are set, the "eval" job shows as skipped and the summary says
# "Not run", so a green run always means the model was actually asked.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'A Workers AI model ID to try instead of the site''s (empty for the site''s own)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cases:
    name: Check the cases
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the cases (no AI calls)
        run: node scripts/eval-outlines.mjs --dry-run
      - name: Look for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI outline eval not run: add the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets."
            {
              echo "# AI outline eval: not run"
              echo ""
              echo "**Not run: the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets are missing.** The cases were checked without calling the AI. The site's own weekly run of the same cases is at https://wright-ai-solutions.com/api/eval."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  eval:
    name: Run the eval against the live model
    needs: cases
    if: needs.cases.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # To push the result to the eval-results branch, one run at a time.
    permissions:
      contents: write
    concurrency:
      group: eval-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Ask the model every case, with the guard and without
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: node scripts/eval-outlines.mjs --json=eval-result.json ${MODEL:+--model="$MODEL"}
      - name: Record the result on the eval-results branch
        if: always() && hashFiles('eval-result.json') != ''
        run: sh scripts/push-eval-record.sh --result=eval-result.json
