name: Deploy check

# After a push to main, Cloudflare Workers Builds deploys the site and publishes
# the deployed commit at /version.txt (scripts/write-version.sh). This fails,
# visibly, if production isn't serving the pushed commit within 15 minutes, so a
# failed or un-promoted deploy can't leave the live site silently stale. Then it
# checks the live site works (scripts/smoke-test.mjs): pages and security
# headers, the API, open times from Cal.com, the published AI eval result, the
# Worker's daily check of each outside service (email, calendar, AI, bot check,
# phone alerts; /api/health), and the leads list asking for its password. It runs again each morning, which
# also catches a dashboard change that deployed something other than main.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-serves-this-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for https://wright-ai-solutions.com/version.txt to match this commit
        run: |
          for attempt in $(seq 1 30); do
            live=$(curl -fsS --max-time 10 "https://wright-ai-solutions.com/version.txt?check=$GITHUB_RUN_ID-$attempt" | tr -d '[:space:]' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Production is serving $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: production reports '${live:-nothing}', waiting for $GITHUB_SHA"
            sleep 30
          done
          echo "::error::Production is not serving $GITHUB_SHA after 15 minutes. Check the Cloudflare Workers Builds log and which deployment the domain points at."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the live site works
        run: node scripts/smoke-test.mjs --sha="$GITHUB_SHA"
