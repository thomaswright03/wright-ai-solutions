name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >
            --no-progress
            --root-dir ${{ github.workspace }}
            --fallback-extensions html
            --remap '^https://wright-ai-solutions\.com/(.*)$ file://${{ github.workspace }}/$1'
            index.html 404.html privacy.html README.md docs/*.md
          fail: true
        # --root-dir resolves root-relative links ("/", "/#work", "/privacy") against
        # the repo root, and --fallback-extensions maps "/privacy" to privacy.html,
        # matching how Cloudflare serves these files (see wrangler.jsonc). --remap checks this site's
        # own absolute URLs (canonical, og:image) against the files in this commit
        # rather than the live deploy, so a PR adding a page isn't failed for the
        # page not being live yet.

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full git history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate

  browser-tests:
    # Serves the site the way Cloudflare does (tests/serve.mjs) and checks every
    # page at phone, tablet and desktop widths in both themes: no horizontal
    # overflow, no console errors or failed requests, header/footer present,
    # mobile menu, skip link, theme toggle, contrast and a few a11y rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copyright line present on every page
        run: |
          for f in index.html 404.html privacy.html; do
            grep -qE 'Wright AI Solutions LLC\. All rights reserved\.' "$f" || {
              echo "::error file=$f::Missing 'Wright AI Solutions LLC. All rights reserved.' copyright line"
              exit 1
            }
          done

      - name: Legal name spelled consistently
        run: |
          if grep -n 'Wright AI Solutions, LLC' index.html 404.html privacy.html README.md; then
            echo "::error::Found 'Wright AI Solutions, LLC' (with comma) — the standard form is 'Wright AI Solutions LLC'"
            exit 1
          fi

      - name: Shared footer text stays in sync across pages
        run: |
          extract() { sed -n '/<footer/,/<\/footer>/p' "$1"; }
          for f in 404.html privacy.html; do
            diff <(extract index.html) <(extract "$f") || {
              echo "::error file=$f::footer has drifted from index.html"
              exit 1
            }
          done

      - name: Shared header stays in sync across pages
        run: |
          # index.html links to its own sections ("#work"); the other pages link
          # back to them ("/#work"). Normalise that, then the headers must match.
          extract() { sed -n '/<header/,/<\/header>/p' "$1" | sed 's#href="\##href="/\##g'; }
          for f in 404.html privacy.html; do
            diff <(extract index.html) <(extract "$f") || {
              echo "::error file=$f::header has drifted from index.html"
              exit 1
            }
          done

      - name: One cache-busting version for every page's CSS and JS
        run: |
          versions=$(grep -ohE '\.(css|js)\?v=[0-9]+' index.html 404.html privacy.html | sed 's/.*?v=//' | sort -u)
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::Pages reference different ?v= versions: $(echo $versions)"
            exit 1
          fi
          if grep -nE '(href|src)="/[^"]+\.(css|js)"' index.html 404.html privacy.html; then
            echo "::error::Every local CSS/JS reference needs the shared ?v=$versions"
            exit 1
          fi

      - name: Font sizes and spacing come from the scale in styles.css
        run: |
          # Token definitions ("--fs-*", "--space-*") are the only place raw px values may appear.
          raw=$(grep -vE '^\s*--' styles.css | grep -nE 'font-size:\s*[0-9.]+px|(margin|padding|gap)(-[a-z]+)?:[^;}]*[0-9]px' || true)
          if [ -n "$raw" ]; then
            echo "$raw"
            echo "::error file=styles.css::Use the --fs-* and --space-* tokens instead of raw px values"
            exit 1
          fi

      - name: Every page links to the privacy notice
        run: |
          for f in index.html 404.html privacy.html; do
            grep -q 'href="/privacy"' "$f" || {
              echo "::error file=$f::Missing footer link to /privacy"
              exit 1
            }
          done

      - name: Self-hosted fonts ship with their OFL licence text
        run: |
          for f in fonts/LICENSE-Inter.txt fonts/LICENSE-SpaceGrotesk.txt; do
            grep -q 'SIL OPEN FONT LICENSE Version 1.1' "$f" || {
              echo "::error file=$f::Missing or incomplete OFL licence text"
              exit 1
            }
          done

      - name: Page weight budget (index.html + directly referenced CSS/JS/fonts)
        run: |
          total=$(cat index.html styles.css script.js theme-init.js fonts/fonts.css fonts/*.woff2 | wc -c)
          echo "Total bytes: $total"
          limit=$((500 * 1024))
          if [ "$total" -gt "$limit" ]; then
            echo "::error::Page weight ${total} bytes exceeds ${limit} byte budget"
            exit 1
          fi
