name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >
            --no-progress
            --root-dir ${{ github.workspace }}
            --fallback-extensions html
            index.html 404.html privacy.html README.md
          fail: true
        # --root-dir resolves root-relative links ("/", "/#work", "/privacy") against
        # the repo root, and --fallback-extensions maps "/privacy" to privacy.html,
        # matching how Cloudflare Pages serves these files.

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full git history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes html-validate index.html 404.html privacy.html

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copyright line present on every page
        run: |
          for f in index.html 404.html privacy.html; do
            grep -qE 'Wright AI Solutions LLC\. All rights reserved\.' "$f" || {
              echo "::error file=$f::Missing 'Wright AI Solutions LLC. All rights reserved.' copyright line"
              exit 1
            }
          done

      - name: Legal name spelled consistently
        run: |
          if grep -n 'Wright AI Solutions, LLC' index.html 404.html privacy.html README.md; then
            echo "::error::Found 'Wright AI Solutions, LLC' (with comma) — the standard form is 'Wright AI Solutions LLC'"
            exit 1
          fi

      - name: Shared footer text stays in sync across pages
        run: |
          extract() { sed -n '/<footer/,/<\/footer>/p' "$1"; }
          for f in 404.html privacy.html; do
            diff <(extract index.html) <(extract "$f") || {
              echo "::error file=$f::footer has drifted from index.html"
              exit 1
            }
          done

      - name: Every page links to the privacy notice
        run: |
          for f in index.html 404.html privacy.html; do
            grep -q 'href="/privacy"' "$f" || {
              echo "::error file=$f::Missing footer link to /privacy"
              exit 1
            }
          done

      - name: Self-hosted fonts ship with their OFL licence text
        run: |
          for f in fonts/LICENSE-Inter.txt fonts/LICENSE-SpaceGrotesk.txt; do
            grep -q 'SIL OPEN FONT LICENSE Version 1.1' "$f" || {
              echo "::error file=$f::Missing or incomplete OFL licence text"
              exit 1
            }
          done

      - name: Page weight budget (index.html + directly referenced CSS/JS/fonts)
        run: |
          total=$(cat index.html styles.css script.js fonts/fonts.css fonts/*.woff2 | wc -c)
          echo "Total bytes: $total"
          limit=$((500 * 1024))
          if [ "$total" -gt "$limit" ]; then
            echo "::error::Page weight ${total} bytes exceeds ${limit} byte budget"
            exit 1
          fi
